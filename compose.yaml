name: osi-dev-explorer

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Ejecuta iniciar-docker.cmd para generar la configuracion local}"
    ports:
      - "${SQLSERVER_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd;
          if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi;
          SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" "$$SQLCMD"
          -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 40s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Ejecuta iniciar-docker.cmd para generar la configuracion local}"
      DB_PASSWORD: "${DB_PASSWORD:?Ejecuta iniciar-docker.cmd para generar la configuracion local}"
      DB_HOST: sqlserver
    entrypoint: ["/bin/bash", "/docker-init/init-db.sh"]
    volumes:
      - ./docker/sqlserver/init-db.sh:/docker-init/init-db.sh:ro
      - ./docker/sqlserver/04-create-app-login.docker.sql:/docker-init/04-create-app-login.docker.sql:ro
      - ./redes-database:/database:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./redes-backend
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=RedesDB;encrypt=true;trustServerCertificate=true;applicationName=OSI-Dev-Explorer-Docker"
      DB_USERNAME: redes_app
      DB_PASSWORD: "${DB_PASSWORD:?Ejecuta iniciar-docker.cmd para generar la configuracion local}"
      APP_ADMIN_EMAIL: "${APP_ADMIN_EMAIL:-admin@osidev.local}"
      APP_ADMIN_NAME: "${APP_ADMIN_NAME:-Administrador OSI}"
      APP_ADMIN_PASSWORD: "${APP_ADMIN_PASSWORD:?Ejecuta iniciar-docker.cmd para generar la configuracion local}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}"
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8"
      FACIAL_SERVICE_ENABLED: "${FACIAL_SERVICE_ENABLED:-true}"
      FACIAL_SERVICE_URL: "http://facial-service:8090"
      FACE_INTERNAL_TOKEN: "${FACE_INTERNAL_TOKEN:?Ejecuta iniciar-docker.cmd para generar la configuracion facial}"
      FACE_PENDING_TIMEOUT_SECONDS: "300"
      FACE_LIVENESS_ENABLED: "${FACE_LIVENESS_ENABLED:-true}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      facial-service:
        condition: service_healthy
    restart: unless-stopped

  facial-service:
    build:
      context: ./facial-service
      dockerfile: Dockerfile
    environment:
      CAMERA_HOST: "${CAMERA_HOST:-192.168.1.27}"
      CAMERA_PORT: "${CAMERA_PORT:-554}"
      CAMERA_USERNAME: "${CAMERA_USERNAME:?Ejecuta iniciar-docker.cmd para configurar el usuario RTSP}"
      CAMERA_PASSWORD: "${CAMERA_PASSWORD:?Ejecuta iniciar-docker.cmd para configurar la contrasena RTSP}"
      CAMERA_RTSP_PATH: "${CAMERA_RTSP_PATH:-/live/ch00_0}"
      FACE_INTERNAL_TOKEN: "${FACE_INTERNAL_TOKEN:?Ejecuta iniciar-docker.cmd para generar la configuracion facial}"
      FACE_DATA_KEY: "${FACE_DATA_KEY:?Ejecuta iniciar-docker.cmd para generar la clave de cifrado facial}"
      FACE_DATA_DIR: /app/data/embeddings
      FACE_DETECTION_THRESHOLD: "${FACE_DETECTION_THRESHOLD:-0.70}"
      FACE_MATCH_THRESHOLD: "${FACE_MATCH_THRESHOLD:-0.45}"
      FACE_REQUIRED_SAMPLES: "${FACE_REQUIRED_SAMPLES:-8}"
      FACE_CAPTURE_TIMEOUT_SECONDS: "${FACE_CAPTURE_TIMEOUT_SECONDS:-14}"
      FACE_SAMPLE_INTERVAL_MS: "${FACE_SAMPLE_INTERVAL_MS:-300}"
      FACE_MIN_FACE_PIXELS: "${FACE_MIN_FACE_PIXELS:-120}"
      FACE_MIN_BLUR_VARIANCE: "${FACE_MIN_BLUR_VARIANCE:-30}"
      FACE_LIVENESS_ENABLED: "${FACE_LIVENESS_ENABLED:-true}"
      FACE_LIVENESS_MIN_MOVEMENT: "${FACE_LIVENESS_MIN_MOVEMENT:-0.035}"
    expose:
      - "8090"
    volumes:
      - facial-templates:/app/data/embeddings
    restart: unless-stopped

  frontend:
    build:
      context: ./redes-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
    name: osi-dev-explorer-sqlserver-data
  facial-templates:
    name: osi-dev-explorer-facial-templates
