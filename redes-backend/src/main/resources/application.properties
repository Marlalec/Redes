spring.application.name=redes-backend

# El backend permanece local detrás de IIS. Para una prueba explícita desde otra
# máquina se puede definir SERVER_ADDRESS=0.0.0.0 temporalmente.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.lifecycle.timeout-per-shutdown-phase=20s

# La contraseña es obligatoria y se entrega mediante variable de entorno.
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=RedesDB;encrypt=true;trustServerCertificate=true;applicationName=OSI-Dev-Explorer}
spring.datasource.username=${DB_USERNAME:redes_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

# Los scripts SQL son la única fuente del esquema. Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
server.error.include-stacktrace=never

# Sesión web segura. La contraseña inicial del administrador es obligatoria y
# solo se recibe desde el entorno; nunca se guarda en el repositorio.
app.bootstrap-admin.email=${APP_ADMIN_EMAIL:admin@osidev.local}
app.bootstrap-admin.name=${APP_ADMIN_NAME:Administrador OSI}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=OSI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Desarrollo local React/Vite. En producción IIS entrega frontend y /api bajo
# el mismo origen, por lo que el navegador no necesita CORS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Segundo factor facial. En ejecución Java tradicional permanece desactivado
# hasta configurar el servicio Python; Docker lo habilita explícitamente.
app.face.enabled=${FACIAL_SERVICE_ENABLED:false}
app.face.base-url=${FACIAL_SERVICE_URL:http://127.0.0.1:8090}
app.face.internal-token=${FACE_INTERNAL_TOKEN:}
app.face.pending-timeout-seconds=${FACE_PENDING_TIMEOUT_SECONDS:300}
app.face.liveness-required=${FACE_LIVENESS_ENABLED:true}

logging.level.root=INFO
logging.level.com.universidad.redes=INFO
logging.level.org.hibernate.SQL=WARN
